[package]
name = "bf-vector"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Disposable warm-index prototype; the production query path does not enable this.
experimental-hot-graph = ["dep:hnsw_rs"]
# Test-only: `downgrade_layout`, which writes the row-major layout an older release used.
legacy-fixtures = []

[dependencies]
libc = "=0.2.191"
hnsw_rs = { version = "=0.3.5", optional = true }
bytes = "=1.12.1"
crc32fast = "=1.5.5"
futures = "=0.3.34"
rayon = "=1.12.0"
base64 = "=0.23.1"
half = "=2.7.1"
numkong = "=7.8.7"
roaring = "=0.12.0"
thiserror = "=2.0.21"

[dev-dependencies]
bf-vector = { path = ".", features = ["legacy-fixtures"] }
hnsw_rs = "=0.3.5"
proptest = "=1.12.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
