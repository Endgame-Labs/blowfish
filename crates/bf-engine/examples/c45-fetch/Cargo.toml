[package]
name = "c45-fetch"
version = "0.1.0"
edition = "2024"
publish = false

# A stand-alone S3 fetch timer for Round C45 (its own workspace, so it builds without the engine).
[workspace]

[dependencies]
bytes = "1.11.1"
futures = "0.3.31"
object_store = { version = "=0.14.2", features = ["aws"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }

[profile.release]
debug = 1
