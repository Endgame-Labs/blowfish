name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, forced-indexing]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build -p blowfish
      - name: Start server
        shell: bash
        run: |
          if [ '${{ matrix.mode }}' = forced-indexing ]; then
            export BLOWFISH_INDEX_ROWS=1 BLOWFISH_INDEX_INTERVAL_MS=25
          fi
          target/debug/blowfish serve --storage-url file:///tmp/blowfish-ci > /tmp/blowfish.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          cat /tmp/blowfish.log
          exit 1
      - run: uv run --directory compat compat check --base-url http://127.0.0.1:8000
      - if: failure()
        run: cat /tmp/blowfish.log
