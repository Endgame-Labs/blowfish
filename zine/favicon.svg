  <!-- Cheek blush -->
  <ellipse cx="44" cy="36" rx="3.4" ry="2.2" fill="#e55d4a" opacity="0.65"/>
  <!-- Eye -->
  <circle cx="40.5" cy="28" r="3.4" fill="#242938"/>
  <circle cx="41.7" cy="26.8" r="1.1" fill="#fffdf8"/>
  <!-- Happy little mouth -->
  <path d="M47 33.5 C48.5 34.5, 48.5 36.5, 46.5 37" stroke="#242938" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Tiny side fin -->
  <path d="M27 34 C23 32, 22 38, 28 38.5" fill="#1f8a7a" stroke="#242938" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
