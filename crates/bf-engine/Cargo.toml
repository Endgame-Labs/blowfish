[package]
name = "bf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures = "=0.3.34"
bf-text = { path = "../bf-text" }
async-trait = "=0.1.92"
bf-vector = { path = "../bf-vector" }
metrics = "=0.24.6"
bytes = "=1.12.1"
crc32fast = "=1.5.5"
roaring = { version = "=0.12.0", features = ["serde"] }

base64 = "0.23.1"
bf-types = { path = "../bf-types" }
bf-storage = { path = "../bf-storage" }
bf-wal = { path = "../bf-wal" }
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.18"
half = "2.7.1"
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
async-trait = "=0.1.92"
object_store = "=0.14.2"
tempfile = "3.27.0"
