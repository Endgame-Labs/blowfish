[package]
name = "bf-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
metrics = "=0.24.6"
moka = { version = "=0.12.16", features = ["sync"] }
sha2 = "=0.11.1"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.31"
object_store = { version = "=0.14.2", features = ["aws", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.18"
tokio = { version = "1.54.0", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
