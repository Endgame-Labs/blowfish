{{define "title"}}Org keys{{end}}
{{define "content"}}
<h1>Org superadmin keys</h1>
<p class="mute">A superadmin key controls every project and every key. Keep them in a secret store, give automation an expiry, and revoke the ones you no longer use.</p>
{{template "keytable" .}}
<h2>New superadmin key</h2>
<form class="card" method="post" action="{{.Base}}/org/keys">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<div class="row two">
<div><label for="kname">Name</label><input id="kname" type="text" name="name" placeholder="ops automation" maxlength="200" required></div>
<div><label for="expires">Expires</label><select id="expires" name="expires"><option value="90">in 90 days</option><option value="30">in 30 days</option><option value="365">in a year</option><option value="">never</option></select></div>
</div>
<div class="actions"><button type="submit">Create key</button></div>
</form>
{{end}}
