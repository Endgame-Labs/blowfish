{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{template "title" .}} · blowfish</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A1%3C/text%3E%3C/svg%3E">
<style nonce="{{.Nonce}}">
:root{--bg:#f6f7f9;--card:#fff;--ink:#17202a;--mute:#5d6b7a;--line:#dfe4ea;--accent:#0b6bcb;--accent-ink:#fff;--danger:#b42318;--ok:#067647;--warn-bg:#fff6e5;--code:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mute:#9aa8b6;--line:#2a3541;--accent:#4c9aff;--accent-ink:#06121f;--danger:#ff8a80;--ok:#5fd39b;--warn-bg:#2c2412;--code:#202b37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.1rem}
nav{display:flex;gap:14px;flex:1}
nav a{text-decoration:none;color:var(--mute);padding:4px 0}
nav a.on{color:var(--ink);border-bottom:2px solid var(--accent)}
.who{color:var(--mute);font-size:.9rem;display:flex;gap:10px;align-items:center}
main{max-width:880px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0 .6em}
h2{font-size:1.15rem;margin:1.6em 0 .6em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.mute{color:var(--mute)}.small{font-size:.9rem}
.flash{border-radius:8px;padding:10px 14px;margin:12px 0;border:1px solid var(--line);background:var(--card)}
.flash.ok{border-color:var(--ok)}.flash.error{border-color:var(--danger);color:var(--danger)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.95rem}
input[type=text],input[type=email],select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:2fr 1fr 1fr}}
button,.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
button.danger,.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button.ghost.danger{background:transparent;color:var(--danger)}
button.link{background:none;border:0;padding:0;color:var(--mute);font-weight:400;text-decoration:underline}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:.85rem}
code,.token{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--code);border-radius:5px;padding:1px 5px}
.token{display:block;padding:12px;word-break:break-all;user-select:all;font-size:.95rem}
.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:.8rem;color:var(--mute)}
.badge.admin,.badge.superadmin{border-color:var(--danger);color:var(--danger)}
.warn{background:var(--warn-bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.cta{text-align:center;padding:32px 0 8px}
.inline{display:inline}
.checkbox{display:flex;gap:8px;align-items:flex-start;margin:14px 0}.checkbox input{margin-top:5px}.checkbox label{margin:0;font-weight:400}
</style>
</head>
<body>
<header><div class="bar">
<a class="brand" href="{{.Base}}/">🐡 blowfish</a>
{{if .Email}}<nav>
<a href="{{.Base}}/projects" {{if eq .Nav "projects"}}class="on"{{end}}>Projects</a>
<a href="{{.Base}}/org/keys" {{if eq .Nav "org"}}class="on"{{end}}>Org keys</a>
</nav>
<div class="who"><span>{{.Email}}</span>
<form method="post" action="{{.Base}}/logout" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link" type="submit">Sign out</button></form></div>
{{end}}
</div></header>
<main>
{{with .Flash}}<div class="flash {{.Kind}}" role="status">{{.Text}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
