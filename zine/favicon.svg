  <ellipse cx="34.5" cy="33.5" rx="19" ry="17.5" fill="#f6c94c"/>
  <!-- Cream belly wash -->
  <path d="M20 39 C26 48, 42 48, 49 38 C43 43, 27 44, 20 39 Z" fill="#fff8e1"/>
