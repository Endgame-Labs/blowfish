name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  local-models:
    # In-process GGUF inference needs cmake, a C++ toolchain, and libclang (all on ubuntu-latest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - run: cargo clippy -p bf-models -p blowfish --features bf-models/local-models,blowfish/local-models --all-targets -- -D warnings
      - run: cargo test -p bf-models --features local-models
  docker:
    # Build the image on x86_64 and arm64 (the arm64 runner stands in for Docker on Apple Silicon).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blowfish:ci .
      - name: Smoke test
        run: |
          docker run -d --name bf -p 8000:8000 blowfish:ci
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          docker logs bf
          exit 1
  macos:
    # Native build and tests on Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p blowfish
      - run: cargo test
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, forced-indexing]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build -p blowfish
      - name: Start server
        shell: bash
        run: |
          if [ '${{ matrix.mode }}' = forced-indexing ]; then
            export BLOWFISH_INDEX_ROWS=1 BLOWFISH_INDEX_INTERVAL_MS=25
          fi
          target/debug/blowfish serve --storage-url file:///tmp/blowfish-ci > /tmp/blowfish.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          cat /tmp/blowfish.log
          exit 1
      - run: uv run --directory compat compat check --base-url http://127.0.0.1:8000
      - if: failure()
        run: cat /tmp/blowfish.log
