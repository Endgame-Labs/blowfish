[package]
name = "bf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
bf-types = { path = "../bf-types" }
bf-storage = { path = "../bf-storage" }
bf-wal = { path = "../bf-wal" }
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.18"
half = "2.7.1"
regex = "1.12.3"
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.2"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
