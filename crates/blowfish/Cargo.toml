[package]
name = "blowfish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
http-body-util = "0.1.3"
base64 = "=0.22.1"
uuid = { version = "=1.29.2", features = ["v4"] }
bf-alloc = { path = "../bf-alloc" }
bf-auth = { path = "../bf-auth" }
chrono = { version = "0.4.45", features = ["serde"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
url = "=2.5.8"
humantime = "=2.4.0"
mime = "0.3.18"
axum = "0.8.9"
bf-engine = { path = "../bf-engine" }
bf-models = { path = "../bf-models" }
bf-storage = { path = "../bf-storage" }
bf-types = { path = "../bf-types" }
bf-vector = { path = "../bf-vector" }
clap = { version = "4.6.0", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.0"
tower-http = { version = "0.6.11", features = ["compression-gzip", "decompression-gzip", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
# jemalloc heap profiler (see bf-alloc).
heap-profile = ["bf-alloc/heap-profile"]
# Run GGUF embedding and reranking models in-process (llama.cpp). Needs cmake and clang to build.
local-models = ["bf-models/local-models"]
local-models-native = ["bf-models/local-models-native"]

[dev-dependencies]
flate2 = "1.1.9"
tower = { version = "0.5.3", features = ["util"] }
