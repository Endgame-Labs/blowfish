  <!-- Little spikes -->
  <path d="M32 6 L34.5 12.5 L29.5 12.5 Z
           M49 12 L46 18 L42 14.5 Z
           M57 26 L51 29 L51.5 23.5 Z
           M55 43 L49.5 41 L52 36.5 Z
           M43 55 L40 49.5 L44.5 48.5 Z
           M21 54 L24 49 L19.5 47.5 Z
           M12 43 L17.5 40.5 L15 36 Z
           M13 15 L18 19 L14 21.5 Z"
        fill="#f6c94c" stroke="#242938" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Tail fin -->
  <path d="M13 31 C7 24, 6 26, 8 32 C6 38, 7 40, 14 35 Z"
        fill="#e55d4a" stroke="#242938" stroke-width="2.5" stroke-linejoin="round"/>
