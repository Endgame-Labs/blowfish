[package]
name = "bf-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bf-types = { path = "../bf-types" }
futures = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

llama-cpp-4 = { version = "=0.12.0", optional = true, default-features = false }
sha2 = { version = "0.10.9", optional = true }

[features]
# Run GGUF models in-process through llama.cpp. Needs cmake and a C++ toolchain with libclang to build.
local-models = ["dep:llama-cpp-4", "dep:sha2"]
# Also tune llama.cpp for the build machine's CPU (AVX-512 and so on); the binary may not run elsewhere.
local-models-native = ["local-models", "llama-cpp-4/native"]

[dev-dependencies]
axum = "0.8.9"

[[example]]
name = "local_probe"
required-features = ["local-models"]

[[example]]
name = "local_bench"
required-features = ["local-models"]
