x-blowfish: &blowfish
  build: .
  image: blowfish:local
  restart: unless-stopped
  environment: &blowfish-env
    BLOWFISH_ADMIN_KEY: ${BLOWFISH_ADMIN_KEY:-}
    BLOWFISH_REQUIRE_AUTH: ${BLOWFISH_REQUIRE_AUTH:-false}
services:
  blowfish:
    <<: *blowfish
    ports:
      - "127.0.0.1:${BLOWFISH_PORT:-8000}:8000"
    volumes:
      - blowfish-data:/data
  # The admin console (see webapp/README.md). Start blowfish first, mint a superadmin key with
  # BLOWFISH_ADMIN_KEY, then: docker compose --profile console up -d webapp
  webapp:
    build: ./webapp
    image: blowfish-webapp:local
    profiles: [console]
    restart: unless-stopped
    environment:
      BLOWFISH_WEBAPP_API_URL: http://blowfish:8000
      BLOWFISH_WEBAPP_API_KEY: ${BLOWFISH_WEBAPP_API_KEY:?a superadmin key}
      BLOWFISH_WEBAPP_ADMINS: ${BLOWFISH_WEBAPP_ADMINS:?comma-separated admin emails}
      BLOWFISH_WEBAPP_SESSION_SECRET: ${BLOWFISH_WEBAPP_SESSION_SECRET:?at least 32 characters}
      BLOWFISH_WEBAPP_BASE_URL: ${BLOWFISH_WEBAPP_BASE_URL:-http://127.0.0.1:8090}
      BLOWFISH_WEBAPP_MAILER: ${BLOWFISH_WEBAPP_MAILER:-log}
      BLOWFISH_WEBAPP_SMTP_ADDR: ${BLOWFISH_WEBAPP_SMTP_ADDR:-}
      BLOWFISH_WEBAPP_SMTP_USER: ${BLOWFISH_WEBAPP_SMTP_USER:-}
      BLOWFISH_WEBAPP_SMTP_PASS: ${BLOWFISH_WEBAPP_SMTP_PASS:-}
      BLOWFISH_WEBAPP_SMTP_FROM: ${BLOWFISH_WEBAPP_SMTP_FROM:-}
    ports:
      - "127.0.0.1:${BLOWFISH_WEBAPP_PORT:-8090}:8090"
    depends_on:
      - blowfish
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    profiles: [s3, multinode]
    command: [mini, -dir=/data, -ip=seaweedfs, -ip.bind=0.0.0.0]
    environment:
      # Public, disposable demo credentials. Replace for any nonlocal deployment.
      AWS_ACCESS_KEY_ID: blowfish-demo
      AWS_SECRET_ACCESS_KEY: blowfish-demo-secret
      S3_BUCKET: blowfish
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9333/cluster/status]
      interval: 5s
      timeout: 3s
      retries: 30
  blowfish-s3:
    <<: *blowfish
    profiles: [s3]
    environment:
      <<: *blowfish-env
      BLOWFISH_STORAGE_URL: s3://blowfish/demo
      BLOWFISH_STORAGE_ENDPOINT: http://seaweedfs:8333
      BLOWFISH_STORAGE_REGION: us-east-1
      AWS_ACCESS_KEY_ID: blowfish-demo
      AWS_SECRET_ACCESS_KEY: blowfish-demo-secret
    ports:
      - "127.0.0.1:${BLOWFISH_S3_PORT:-8001}:8000"
    depends_on:
      seaweedfs:
        condition: service_healthy
  node1: &multinode
    <<: *blowfish
    profiles: [multinode]
    environment:
      <<: *blowfish-env
      BLOWFISH_STORAGE_URL: s3://blowfish/multinode
      BLOWFISH_STORAGE_ENDPOINT: http://seaweedfs:8333
      BLOWFISH_STORAGE_REGION: us-east-1
      BLOWFISH_INDEX_ROWS: 2
      BLOWFISH_INDEX_INTERVAL_MS: 50
      AWS_ACCESS_KEY_ID: blowfish-demo
      AWS_SECRET_ACCESS_KEY: blowfish-demo-secret
    ports:
      - "127.0.0.1:8101:8000"
    depends_on:
      seaweedfs:
        condition: service_healthy
  node2:
    <<: *multinode
    ports:
      - "127.0.0.1:8102:8000"
  node3:
    <<: *multinode
    ports:
      - "127.0.0.1:8103:8000"
  proxy:
    image: caddy:2.10.2-alpine
    profiles: [multinode]
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      - ./scripts/Caddyfile.multinode:/etc/caddy/Caddyfile:ro
    depends_on:
      - node1
      - node2
      - node3

volumes:
  blowfish-data:
  seaweed-data:
