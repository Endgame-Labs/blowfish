[package]
name = "bf-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alyze = { version = "=0.2.0", features = ["cjk"] }
async-trait = "=0.1.92"
bitpacking = "=0.9.3"
bytes = "=1.12.1"
crc32fast = "=1.5.5"
fst = "=0.4.7"
