[package]
name = "blowfish-scale-server"
version = "0.1.0"
edition = "2024"
publish = false

# Keep benchmark-only HTTP dependencies out of the engine's dependency graph.
[workspace]

[dependencies]
axum = "=0.8.9"
bf-auth = { path = "../../../bf-auth" }
bf-engine = { path = "../.." }
bf-storage = { path = "../../../bf-storage" }
blowfish = { path = "../../../blowfish" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
