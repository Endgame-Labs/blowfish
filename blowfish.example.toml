# blowfish 🐡 — copy to blowfish.toml, then run:
# blowfish serve --config blowfish.toml
# CLI flags override environment variables, which override this file.
listen = "0.0.0.0:8000"
# Prefer BLOWFISH_ADMIN_KEY in your deployment's secret environment.
# admin_key = "replace-with-a-long-random-secret"
require_auth = false # Set true outside local development.
# Optional, unauthenticated Prometheus endpoint. Keep on a trusted interface.
# metrics_listen = "127.0.0.1:9100"
# Legacy alias for storage.url; do not set both.
# storage_url = "file:///tmp/blowfish"

[storage]
url = "file:///tmp/blowfish" # Also s3://bucket/prefix, or memory:// for disposable tests.
# S3-compatible service endpoint; AWS S3 uses its normal endpoint when omitted.
# endpoint = "http://127.0.0.1:8333"
# region = "us-east-1"
# profile = "default" # Optional profile in AWS_SHARED_CREDENTIALS_FILE or ~/.aws/credentials.
read_only = false # Skip the mutating probe, and reject storage writes.
single_writer = false # Force one writer even if conditional writes are available.

# S3 credentials use AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and optionally
# AWS_SESSION_TOKEN, or the selected AWS profile. Do not put credentials in URLs.
# Logging is controlled by RUST_LOG, e.g. blowfish=info,bf_engine=info.

[engine]
indexing = true
index_rows = 1000
index_bytes = 8388608
index_age_ms = 5000
index_interval_ms = 250
compaction_segments = 4
retention_ms = 3600000
lease_duration_ms = 30000
# Default: an eighth of the memory limit (host RAM or cgroup), within 128 MiB to 2 GB.
max_unindexed_bytes = 2000000000
eventual_tail_bytes = 134217728
ann_nprobe = 64
ann_rerank_factor = 32
recall_sample_rate = 0.01
# Large reclustered namespaces read their ANN directory in pieces. These are environment-only
# variables (see docs/configuration.md): BF_ANN_PAGED (0 turns it off), BF_ANN_PAGE_MARGIN (12),
# BF_ANN_PAGE_KAPPA (0.5), BF_ANN_PAGE_ENTRIES (24), and BF_ANN_PAGED_MIN_ENTRIES (100000).

[storage.cache]
# memory_bytes defaults to one quarter of available memory, capped at 8 GiB.
# memory_bytes = 268435456
disk_bytes = 68719476736
# disk_dir = "/var/cache/blowfish"
# namespace = "optional-custom-cache-identity"
block_size = 1048576
max_coalesce_blocks = 8
fetch_concurrency = 16
prefetch_concurrency = 4

