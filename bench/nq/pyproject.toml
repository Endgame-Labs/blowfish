[project]
name = "blowfish-bench-nq"
version = "0.1.0"
description = "BEIR Natural Questions benchmark harness for blowfish"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pyarrow>=18",
]

[dependency-groups]
# Same-machine baselines (qdrant.py, lance.py).
others = [
  "qdrant-client==1.20.0",
  "lancedb==0.41.0",
]
